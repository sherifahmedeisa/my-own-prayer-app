name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          cp app/build/outputs/apk/release/app-release.apk PrayerTimes.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTimes-APK
          path: PrayerTimes.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create or Update Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Prayer Times Android APK v1.0 (With Live Home Screen Counter Widget)
          body: |
            ### 🕌 Prayer Times Android App & Live Counter Widget
            
            Download **`PrayerTimes.apk`** below and tap to install on your Android device:
            
            - **📱 Home Screen App Icon**: Beautiful launcher icon with crescent moon & star.
            - **⏱️ Live Counter Widget**: Home screen widget with real-time ticking `Chronometer` countdown to the next prayer.
            - **📶 100% Offline Resilience**: 30-day UmmahAPI monthly sync + built-in solar astronomical calculation fallback.
            - **🎨 Exact Dark Emerald & Gold Theme**: Handcrafted dark Islamic colors.
          files: PrayerTimes.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push APK to repository for Vercel
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f PrayerTimes.apk
          git commit -m "chore: host compiled PrayerTimes.apk on Vercel [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"
